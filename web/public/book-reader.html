<!DOCTYPE html>
<html lang="en" data-theme="dark" id="book-reader">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<title>Book</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #161412;
    --bg-2: #1c1a17;
    --line: #322e29;
    --line-2: #463f38;
    --text: #efe7d8;
    --muted: #9a9083;
    --gold: #e8b86a;
    --gold-dim: rgba(232, 184, 106, .16);
    --serif: Georgia, "Iowan Old Style", Palatino, "Palatino Linotype", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  html[data-theme="light"] {
    color-scheme: light;
    --bg: #f7f1e6;
    --bg-2: #efe6d6;
    --line: #d4c7b0;
    --line-2: #b9aa93;
    --text: #1c1916;
    --muted: #5c5348;
    --gold: #8b5a2b;
    --gold-dim: rgba(139, 90, 43, .14);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 var(--sans);
    display: flex;
    flex-direction: column;
    min-height: 100%;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 12px 16px 0;
    min-width: 0;
  }
  h1 {
    flex: 1;
    min-width: 0;
    margin: 0;
    font: 700 22px/1.25 var(--serif);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #place {
    flex: none;
    color: var(--gold);
    font: 600 13px/1 var(--sans);
    letter-spacing: .02em;
  }
  #chapter {
    margin: 2px 16px 0;
    color: var(--muted);
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-height: 1.2em;
  }
  .tools {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 8px 16px 10px;
  }
  button {
    font: 600 14px/1 var(--sans);
    color: var(--text);
    background: transparent;
    border: 1px solid var(--line-2);
    border-radius: 999px;
    padding: 8px 14px;
    cursor: pointer;
  }
  button:hover, button:focus-visible { border-color: var(--gold); outline: none; }
  button[aria-pressed="true"], button.on { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); }
  button:disabled { opacity: .4; cursor: default; }
  .tools .spacer { flex: 1; }
  #stage {
    position: relative;
    flex: 1;
    min-height: 0;
    background: var(--bg);
  }
  #stage foliate-view { display: block; width: 100%; height: 100%; background: var(--bg); }
  #plain {
    height: 100%;
    overflow: auto;
    padding: 8px 8vw 32px;
  }
  #plain article {
    max-width: 68ch;
    margin: 0 auto;
    font: 19px/1.65 var(--serif);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  #status {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    margin: 0;
    padding: 24px;
    text-align: center;
    color: var(--muted);
    background: var(--bg);
    z-index: 2;
  }
  #status:empty { display: none; }
  #chapters {
    position: absolute;
    z-index: 3;
    top: 0;
    bottom: 0;
    left: 0;
    width: min(360px, 92%);
    background: var(--bg-2);
    border-right: 1px solid var(--line);
    box-shadow: 12px 0 40px rgba(0, 0, 0, .28);
    display: none;
    flex-direction: column;
    min-height: 0;
  }
  #chapters.open { display: flex; }
  #chapters h2 {
    margin: 0;
    padding: 14px 16px 8px;
    font: 700 16px/1.2 var(--serif);
  }
  #chapter-list { overflow: auto; padding: 4px 8px 16px; }
  #chapter-list button {
    display: block;
    width: 100%;
    text-align: left;
    border: 0;
    border-radius: 8px;
    background: transparent;
    padding: 8px 10px;
    font-weight: 500;
  }
  #chapter-list button:hover, #chapter-list button[aria-current="true"] {
    background: var(--gold-dim);
    color: var(--text);
  }
  #chapter-list .empty { color: var(--muted); padding: 8px 10px; margin: 0; }
  #progress {
    flex: none;
    height: 10px;
    margin: 0;
    background: #26221e;
    cursor: pointer;
  }
  html[data-theme="light"] #progress { background: #e4d9c6; }
  #progress i {
    display: block;
    height: 100%;
    width: 0;
    background: var(--gold);
  }
  @media (max-width: 640px) {
    h1 { font-size: 18px; }
    header { padding: 10px 12px 0; }
    #chapter { margin: 2px 12px 0; }
    .tools { padding: 8px 12px; gap: 6px; }
    button { padding: 10px 12px; min-height: 44px; }
    #plain { padding: 4px 16px 24px; }
    #plain article { font-size: 17px; }
    #chapters { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    #progress i { transition: none; }
  }
</style>
<script src="/book-reader.js?v=2"></script>
</head>
<body>
  <header>
    <h1 id="title">Book</h1>
    <span id="place"></span>
  </header>
  <p id="chapter"></p>
  <div class="tools">
    <button type="button" id="btn-chapters" aria-expanded="false" aria-controls="chapters">Chapters</button>
    <span class="spacer"></span>
    <button type="button" id="btn-prev">Previous</button>
    <button type="button" id="btn-next">Next</button>
  </div>
  <div id="stage">
    <p id="status" role="status">Opening the book</p>
    <div id="chapters">
      <h2>Chapters</h2>
      <div id="chapter-list"></div>
    </div>
    <div id="plain" hidden><article id="plain-body"></article></div>
  </div>
  <div id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Reading progress" tabindex="0"><i id="progress-bar"></i></div>
</body>
</html>
